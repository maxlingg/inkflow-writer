name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Find and unzip source package
        run: |
          ZIP_FILE="$(find . -maxdepth 1 -iname 'inkflow_writer_source_v1_4_6.zip' | head -n 1)"
          if [ -z "$ZIP_FILE" ]; then
            ZIP_FILE="$(find . -maxdepth 1 -iname 'inkflow_writer_source_v1_4_5.zip' | head -n 1)"
          fi
          if [ -z "$ZIP_FILE" ]; then
            ZIP_FILE="$(find . -maxdepth 1 -iname 'inkflow_writer_source_v1_4_4.zip' | head -n 1)"
          fi
          if [ -z "$ZIP_FILE" ]; then
            ZIP_FILE="$(find . -maxdepth 1 -iname 'inkflow_writer_source_v1_4_3.zip' | head -n 1)"
          fi
          if [ -z "$ZIP_FILE" ]; then
            ZIP_FILE="$(find . -maxdepth 1 -iname 'inkflow_writer_source_v1_4_2.zip' | head -n 1)"
          fi
          if [ -z "$ZIP_FILE" ]; then
            ZIP_FILE="$(find . -maxdepth 1 \( -iname 'inkflow_writer_source.zip' -o -iname '*.zip' \) | head -n 1)"
          fi
          echo "Using source package: $ZIP_FILE"
          test -n "$ZIP_FILE"
          unzip -o "$ZIP_FILE"

      - name: Create Flutter Android project
        run: |
          flutter --version
          flutter create inkflow_writer_app --org com.maxlingg.inkflow --platforms=android
          cp -R inkflow_writer/lib inkflow_writer_app/
          cp inkflow_writer/pubspec.yaml inkflow_writer_app/pubspec.yaml
          cp inkflow_writer/analysis_options.yaml inkflow_writer_app/analysis_options.yaml
          rm -rf inkflow_writer_app/test

      - name: Add Android permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('inkflow_writer_app/android/app/src/main/AndroidManifest.xml')
          text = path.read_text()
          needle = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          permissions = [
              '    <uses-permission android:name="android.permission.INTERNET" />',
          ]
          for permission in permissions:
              if permission not in text:
                  text = text.replace(needle, needle + '\n' + permission)
          path.write_text(text)
          PY

      - name: Install dependencies
        run: |
          cd inkflow_writer_app
          flutter pub get
          rm -rf test

      - name: Analyze Dart code
        run: |
          cd inkflow_writer_app
          set +e
          flutter analyze lib --no-fatal-infos --no-fatal-warnings 2>&1 | tee analyze.log
          ANALYZE_STATUS=${PIPESTATUS[0]}
          echo "Analyzer raw exit code: $ANALYZE_STATUS"
          if grep -E '^[[:space:]]*error •|^error •' analyze.log; then
            echo "Dart analyzer found real errors. Failing build."
            exit 1
          fi
          echo "No Dart analyzer errors found. Continuing; info-level messages are non-blocking."

      - name: Build APK
        run: |
          cd inkflow_writer_app
          flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: inkflow-writer-apk-v1-4-7
          path: inkflow_writer_app/build/app/outputs/flutter-apk/app-release.apk
